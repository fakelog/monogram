name: Android CI

env:
  NDK_VERSION: 27.0.12077973

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["master", "develop"]
  workflow_dispatch:

jobs:
  debug-build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK tools
      uses: android-actions/setup-android@v3

    - name: Resolve Android SDK path
      run: echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

    - name: Install Android NDK
      run: sdkmanager "ndk;${NDK_VERSION}"

    - name: Write Telegram API secrets
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      if: ${{ env.TELEGRAM_API_ID != '' && env.TELEGRAM_API_HASH != '' }}
      run: |
        cat > local.properties <<EOF
        API_ID=$TELEGRAM_API_ID
        API_HASH=$TELEGRAM_API_HASH
        EOF

    - name: Write Firebase config
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
      run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

    - name: Make all scripts executable
      run: |
        chmod +x gradlew
        chmod +x presentation/src/main/cpp/build.sh

    - name: Build libvpx
      run: |
        export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
        cd presentation/src/main/cpp
        ./build.sh

    - name: Build Debug APK (without GMS)
      run: ./gradlew assembleDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      with:
        name: app-universal-no-appid
        path: app/build/outputs/apk/debug/app-universal-debug.apk

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      with:
        name: app-arm64-v8a-no-appid
        path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      with:
        name: app-armeabi-v7a-no-appid
        path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

    - name: Upload x86_64 APK
      uses: actions/upload-artifact@v7
      with:
        name: app-x86_64-no-appid
        path: app/build/outputs/apk/debug/app-x86_64-debug.apk

  release-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK tools
      uses: android-actions/setup-android@v3

    - name: Resolve Android SDK path
      run: echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

    - name: Install Android NDK
      run: sdkmanager "ndk;${NDK_VERSION}"

    - name: Write Telegram API secrets
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      if: ${{ env.TELEGRAM_API_ID != '' && env.TELEGRAM_API_HASH != '' }}
      run: |
        cat > local.properties <<EOF
        API_ID=$TELEGRAM_API_ID
        API_HASH=$TELEGRAM_API_HASH
        EOF

    - name: Write Firebase config
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
      run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

    - name: Make all scripts executable
      run: |
        chmod +x gradlew
        chmod +x presentation/src/main/cpp/build.sh

    - name: Build libvpx
      run: |
        export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
        cd presentation/src/main/cpp
        ./build.sh

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload universal release APK
      uses: actions/upload-artifact@v7
      with:
        name: monogram-universal-release
        path: app/build/outputs/apk/release/monogram-universal-*-release.apk

    - name: Upload arm64-v8a release APK
      uses: actions/upload-artifact@v7
      with:
        name: monogram-arm64-v8a-release
        path: app/build/outputs/apk/release/monogram-arm64-v8a-*-release.apk

    - name: Upload armeabi-v7a release APK
      uses: actions/upload-artifact@v7
      with:
        name: monogram-armeabi-v7a-release
        path: app/build/outputs/apk/release/monogram-armeabi-v7a-*-release.apk

    - name: Upload x86_64 release APK
      uses: actions/upload-artifact@v7
      with:
        name: monogram-x86_64-release
        path: app/build/outputs/apk/release/monogram-x86_64-*-release.apk
