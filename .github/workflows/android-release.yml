name: Android Release

permissions:
  contents: write

env:
  NDK_VERSION: 27.0.12077973

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK tools
      uses: android-actions/setup-android@v3

    - name: Resolve Android SDK path
      run: echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

    - name: Install Android NDK
      run: sdkmanager "ndk;${NDK_VERSION}"

    - name: Write Telegram API secrets
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      if: ${{ env.TELEGRAM_API_ID != '' && env.TELEGRAM_API_HASH != '' }}
      run: |
        cat > local.properties <<EOF
        API_ID=$TELEGRAM_API_ID
        API_HASH=$TELEGRAM_API_HASH
        EOF

    - name: Write Firebase config
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
      run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

    - name: Prepare release signing config
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
          echo "Missing one or more release signing secrets (RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD)." >&2
          exit 1
        fi

        keystore_path="$GITHUB_WORKSPACE/release.keystore"
        printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

        touch local.properties
        cat >> local.properties <<EOF
        SIGNING_STORE_FILE=$keystore_path
        SIGNING_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
        SIGNING_KEY_ALIAS=$RELEASE_KEY_ALIAS
        SIGNING_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
        EOF

    - name: Validate release keystore credentials
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        keystore_path="$GITHUB_WORKSPACE/release.keystore"

        keytool -list \
          -keystore "$keystore_path" \
          -storepass "$RELEASE_STORE_PASSWORD" \
          -alias "$RELEASE_KEY_ALIAS" >/dev/null

        work_dir="$(mktemp -d)"
        printf 'Manifest-Version: 1.0\n' > "$work_dir/MANIFEST.MF"
        jar --create --file "$work_dir/unsigned.jar" --manifest "$work_dir/MANIFEST.MF" -C "$work_dir" MANIFEST.MF

        if ! jarsigner \
          -keystore "$keystore_path" \
          -storepass "$RELEASE_STORE_PASSWORD" \
          -keypass "$RELEASE_KEY_PASSWORD" \
          -signedjar "$work_dir/signed.jar" \
          "$work_dir/unsigned.jar" \
          "$RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
          echo "Release keystore credentials are invalid. Check RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD against the private key inside RELEASE_KEYSTORE_BASE64." >&2
          exit 1
        fi

    - name: Make all scripts executable
      run: |
        chmod +x gradlew
        chmod +x presentation/src/main/cpp/build.sh

    - name: Build libvpx
      run: |
        export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
        cd presentation/src/main/cpp
        ./build.sh

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Resolve release version
      run: |
        version_name=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
        if [ -z "$version_name" ]; then
          echo "Failed to resolve versionName from app/build.gradle.kts" >&2
          exit 1
        fi
        echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"

    - name: Resolve release tag
      env:
        VERSION_NAME: ${{ env.VERSION_NAME }}
      run: |
        short_sha=$(printf '%.7s' "$GITHUB_SHA")
        release_tag="v${VERSION_NAME}-${short_sha}"
        echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
        echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

    - name: Ensure release tag exists
      env:
        RELEASE_TAG: ${{ env.RELEASE_TAG }}
      run: |
        git fetch --tags
        if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
          echo "Tag $RELEASE_TAG already exists"
        else
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
        fi

    - name: Publish GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION_NAME: ${{ env.VERSION_NAME }}
        RELEASE_TAG: ${{ env.RELEASE_TAG }}
        SHORT_SHA: ${{ env.SHORT_SHA }}
      run: |
        set -- \
          app/build/outputs/apk/release/monogram-universal-"$VERSION_NAME"-release.apk \
          app/build/outputs/apk/release/monogram-arm64-v8a-"$VERSION_NAME"-release.apk \
          app/build/outputs/apk/release/monogram-armeabi-v7a-"$VERSION_NAME"-release.apk \
          app/build/outputs/apk/release/monogram-x86_64-"$VERSION_NAME"-release.apk

        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release upload "$RELEASE_TAG" "$@" --clobber
        else
          gh release create "$RELEASE_TAG" "$@" \
            --target "$GITHUB_SHA" \
            --title "MonoGram $VERSION_NAME ($SHORT_SHA)" \
            --notes "Automated release for version $VERSION_NAME from commit $GITHUB_SHA."
        fi
