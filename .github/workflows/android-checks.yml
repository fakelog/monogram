name: Android Checks

permissions:
  contents: read

env:
  NDK_VERSION: 27.0.12077973

on:
  pull_request:
    branches: ["master", "develop"]
  workflow_dispatch:

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK tools
      uses: android-actions/setup-android@v3

    - name: Resolve Android SDK path
      run: echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

    - name: Install Android NDK
      run: sdkmanager "ndk;${NDK_VERSION}"

    - name: Write Telegram API secrets
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      if: ${{ env.TELEGRAM_API_ID != '' && env.TELEGRAM_API_HASH != '' }}
      run: |
        cat > local.properties <<EOF
        API_ID=$TELEGRAM_API_ID
        API_HASH=$TELEGRAM_API_HASH
        EOF

    - name: Write Firebase config
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
      run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

    - name: Make all scripts executable
      run: |
        chmod +x gradlew
        chmod +x presentation/src/main/cpp/build.sh

    - name: Build libvpx
      run: |
        export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
        cd presentation/src/main/cpp
        ./build.sh

    - name: Build Debug APK (without GMS)
      run: ./gradlew assembleDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest
